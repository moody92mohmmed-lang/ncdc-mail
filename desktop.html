<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بريد إدارة التطعيمات — NCDC</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;direction:rtl;font-family:'Tajawal',sans-serif}
:root{
  --bg:#0F172A;--s1:#1E293B;--s2:#283447;--s3:#334155;
  --br:rgba(148,163,184,.1);--br2:rgba(148,163,184,.2);
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#475569;
  --bl:#3B82F6;--bl-l:#60A5FA;--bl-bg:rgba(59,130,246,.1);
  --gr:#22C55E;--gr-bg:rgba(34,197,94,.1);
  --am:#F59E0B;--am-bg:rgba(245,158,11,.1);
  --rd:#EF4444;--rd-bg:rgba(239,68,68,.1);
  --pu:#A855F7;--pu-bg:rgba(168,85,247,.1);
  --r:8px;--rl:14px
}
body{background:var(--bg);color:var(--tx);font-size:13px;min-height:100vh}
/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 25% 40%,rgba(59,130,246,.15),transparent 55%)}
.lc{background:var(--s1);border:1px solid var(--br2);border-radius:20px;
  padding:36px 28px;width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ll{width:56px;height:56px;border-radius:16px;background:var(--bl-bg);border:1px solid rgba(59,130,246,.3);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--bl-l)}
.lo{font-size:14px;font-weight:500;color:var(--tx)}
.ld{font-size:11px;color:var(--tx3)}
.le{background:var(--rd-bg);border:1px solid rgba(239,68,68,.25);border-radius:var(--r);
  padding:8px 12px;font-size:12px;color:var(--rd);width:100%;display:none;align-items:center;gap:6px}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.rb{background:var(--s2);border:1px solid var(--br);border-radius:var(--r);
  padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:5px;font-size:12px;color:var(--tx2);transition:all .15s}
.rb i{font-size:20px}
.rb.on{background:var(--bl-bg);border-color:rgba(59,130,246,.35);color:var(--bl-l)}
.li{width:100%;background:var(--s2);border:1px solid var(--br2);border-radius:var(--r);
  padding:10px 12px;color:var(--tx);font-size:13px;font-family:'Tajawal',sans-serif;
  outline:none;transition:border-color .15s}
.li:focus{border-color:var(--bl)}
.lb{width:100%;background:var(--bl);color:#fff;border:none;border-radius:var(--r);
  padding:11px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Tajawal',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:7px}
.lb:hover{opacity:.88}
/* APP */
#app{display:none;min-height:100vh}
.topbar{background:var(--s1);border-bottom:1px solid var(--br);
  padding:10px 20px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100}
.tb-brand{display:flex;align-items:center;gap:10px;flex:1}
.tb-ico{width:32px;height:32px;border-radius:9px;background:var(--bl-bg);
  border:1px solid rgba(59,130,246,.3);color:var(--bl-l);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.tb-nm{font-size:13px;font-weight:500;color:var(--tx)}
.tb-sb{font-size:10px;color:var(--tx3)}
.tb-act{display:flex;align-items:center;gap:7px}
.tb-srch{display:flex;align-items:center;gap:6px;background:var(--s2);
  border:1px solid var(--br);border-radius:var(--r);padding:5px 10px}
.tb-srch i{color:var(--tx3);font-size:14px}
.tb-srch input{background:none;border:none;outline:none;color:var(--tx);
  font-size:12px;width:140px;font-family:'Tajawal',sans-serif}
.ib{background:var(--s2);border:1px solid var(--br);border-radius:var(--r);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tx2);font-size:15px;transition:all .12s}
.ib:hover{background:var(--s3);color:var(--tx)}
.uc{display:flex;align-items:center;gap:6px;background:var(--s2);
  border:1px solid var(--br);border-radius:20px;padding:4px 10px 4px 6px;cursor:pointer}
.ua{width:22px;height:22px;border-radius:50%;background:var(--bl-bg);
  border:1px solid rgba(59,130,246,.3);color:var(--bl-l);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.un{font-size:11px;color:var(--tx2)}
/* TABS */
.tabs{background:var(--s1);border-bottom:1px solid var(--br);
  padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.nt{padding:10px 13px;font-size:12px;color:var(--tx2);cursor:pointer;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;
  white-space:nowrap;transition:all .12s}
.nt:hover{color:var(--tx)}
.nt.on{color:var(--bl-l);border-bottom-color:var(--bl-l);font-weight:500}
.nb{background:var(--rd-bg);color:var(--rd);font-size:10px;padding:1px 5px;border-radius:20px;font-weight:500}
/* CONTENT */
.ct{padding:20px;max-width:1200px;margin:0 auto}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:18px}
.sc{background:var(--s1);border:1px solid var(--br);border-radius:var(--rl);
  padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:border-color .15s}
.sc:hover{border-color:var(--br2)}
.sc-i{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px}
.sc-n{font-size:28px;font-weight:700;color:var(--tx);line-height:1}
.sc-l{font-size:11px;color:var(--tx2)}
/* CHARTS */
.cg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}
.cc{background:var(--s1);border:1px solid var(--br);border-radius:var(--rl);padding:16px}
.cc-t{font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.dw{display:flex;flex-direction:column;align-items:center;gap:10px}
.dl{width:100%;display:flex;flex-direction:column;gap:5px}
.dlr{display:flex;align-items:center;gap:7px;font-size:11px}
.dld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dll{flex:1;color:var(--tx2)}
.dln{font-weight:500;color:var(--tx)}
.bl{display:flex;flex-direction:column;gap:9px}
.bi{display:flex;flex-direction:column;gap:3px}
.bh{display:flex;justify-content:space-between;font-size:11px}
.bl2{color:var(--tx2)}
.bv{color:var(--tx);font-weight:500}
.bt{height:5px;background:var(--s2);border-radius:10px;overflow:hidden}
.bf{height:100%;border-radius:10px;transition:width .7s ease}
.al{display:flex;flex-direction:column}
.ar{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--br)}
.ar:last-child{border-bottom:none}
.ad{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0}
.at{font-size:11px;color:var(--tx2);flex:1;line-height:1.5}
.at2{font-size:10px;color:var(--tx3);white-space:nowrap}
/* TABLE */
.tc{background:var(--s1);border:1px solid var(--br);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.th{padding:11px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tt{font-size:13px;font-weight:500;color:var(--tx);flex:1;display:flex;align-items:center;gap:7px}
.fc{display:flex;gap:4px}
.fp{padding:3px 9px;border-radius:20px;font-size:11px;border:1px solid var(--br);
  background:transparent;cursor:pointer;color:var(--tx2);font-family:'Tajawal',sans-serif;transition:all .12s}
.fp.on{background:var(--bl-bg);color:var(--bl-l);border-color:rgba(59,130,246,.3)}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th{padding:8px 13px;text-align:right;font-weight:500;font-size:11px;color:var(--tx3);
  background:var(--s2);border-bottom:1px solid var(--br);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td{padding:9px 13px;border-bottom:1px solid var(--br);color:var(--tx2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--s2);color:var(--tx)}
.es{text-align:center;padding:40px;color:var(--tx3)}
.es i{font-size:32px;display:block;margin-bottom:8px;opacity:.3}
/* BADGES */
.b{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap}
.bn{background:var(--rd-bg);color:var(--rd)}
.bp{background:var(--am-bg);color:var(--am)}
.bd{background:var(--gr-bg);color:var(--gr)}
.ba{background:var(--s2);color:var(--tx3)}
.ti{background:var(--bl-bg);color:var(--bl-l);padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.to{background:var(--gr-bg);color:var(--gr);padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.ac{background:var(--s2);border:1px solid var(--br);border-radius:4px;
  padding:2px 6px;font-size:10px;color:var(--tx3);display:inline-flex;align-items:center;gap:3px}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;
  justify-content:center;z-index:500;padding:16px}
.mb{background:var(--s1);border:1px solid var(--br2);border-radius:var(--rl);
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column}
.mb.wide{max-width:780px}
.mh{padding:14px 18px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px;flex-shrink:0}
.mt{font-size:14px;font-weight:500;color:var(--tx);flex:1;display:flex;align-items:center;gap:8px}
.mc{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px}
.md{padding:18px;display:flex;flex-direction:column;gap:12px;flex:1}
.mf{padding:12px 18px;border-top:1px solid var(--br);display:flex;gap:7px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:11px;color:var(--tx2)}
.fi{width:100%;background:var(--s2);border:1px solid var(--br2);border-radius:var(--r);
  padding:8px 10px;color:var(--tx);font-size:12px;font-family:'Tajawal',sans-serif;
  outline:none;transition:border-color .12s}
.fi:focus{border-color:var(--bl)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* DETAIL */
.dr{display:flex;justify-content:space-between;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid var(--br);font-size:12px}
.dr:last-child{border-bottom:none}
.dk{color:var(--tx3)}
.dv{color:var(--tx);font-weight:500;text-align:left;max-width:290px;word-break:break-word}
/* ── ATTACHMENT VIEWER ── */
.att-section{background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:12px;margin-top:4px}
.att-section-title{font-size:11px;color:var(--tx3);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.att-pdf-frame{width:100%;height:380px;border:none;border-radius:var(--r);background:#525659;display:block}
.att-img-preview{width:100%;max-height:320px;object-fit:contain;border-radius:var(--r);
  border:1px solid var(--br);cursor:zoom-in;display:block}
.att-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* FULL VIEWERS */
.viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:800;
  display:flex;flex-direction:column}
.viewer-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--s1);border-bottom:1px solid var(--br);flex-shrink:0}
.viewer-title{flex:1;font-size:13px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-body{flex:1;overflow:hidden;background:#525659}
.viewer-body iframe{width:100%;height:100%;border:none;display:block}
.viewer-body img{width:100%;height:100%;object-fit:contain;display:block}
/* ATTACH UPLOAD */
.abox{background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:12px}
.abox-l{font-size:11px;color:var(--tx2);font-weight:500;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.agr{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.acard{background:var(--bg);border:1px dashed var(--br2);border-radius:var(--r);
  padding:10px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:5px;transition:all .12s}
.acard:hover{border-color:var(--bl);background:var(--bl-bg)}
.aci{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.air{background:var(--rd-bg);color:var(--rd)}
.aib{background:var(--bl-bg);color:var(--bl-l)}
.acn{font-size:11px;font-weight:500;color:var(--tx)}
.acs{font-size:10px;color:var(--tx3)}
.apv{display:flex;align-items:center;gap:9px;background:var(--bg);
  border:1px solid var(--br);border-radius:var(--r);padding:8px 10px;margin-top:7px}
/* BTNS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);
  font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:'Tajawal',sans-serif;transition:opacity .12s}
.btn:hover{opacity:.87}
.btn-bl{background:var(--bl);color:#fff}
.btn-gr{background:var(--gr-bg);color:var(--gr);border:1px solid rgba(34,197,94,.25)}
.btn-am{background:var(--am-bg);color:var(--am);border:1px solid rgba(245,158,11,.25)}
.btn-rd{background:var(--rd-bg);color:var(--rd);border:1px solid rgba(239,68,68,.25)}
.btn-gh{background:transparent;color:var(--tx2);border:1px solid var(--br2)}
.btn-sm{padding:5px 10px;font-size:11px}
/* REPORTS */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbr{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--br)}
.pbr:last-child{border-bottom:none}
.pbh{display:flex;justify-content:space-between;font-size:11px}
.pbl{color:var(--tx2)}.pbv{color:var(--tx);font-weight:500}
.pbt{height:5px;background:var(--s2);border-radius:10px;overflow:hidden}
.pbf{height:100%;border-radius:10px;transition:width .8s ease}
/* TOAST */
.tw{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;z-index:900;pointer-events:none}
.tt2{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r);
  font-size:12px;font-weight:500;pointer-events:auto;animation:ti2 .25s ease;white-space:nowrap}
.tok{background:var(--gr-bg);color:var(--gr);border:1px solid rgba(34,197,94,.3)}
.terr{background:var(--rd-bg);color:var(--rd);border:1px solid rgba(239,68,68,.3)}
@keyframes ti2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:900px){.cg{grid-template-columns:1fr}.rg{grid-template-columns:1fr}.fr{grid-template-columns:1fr}
  .tb-srch input{width:90px}table th:nth-child(n+5),table td:nth-child(n+5){display:none}}
@media(max-width:600px){.sg{grid-template-columns:1fr 1fr}.ct{padding:12px}
  .agr{grid-template-columns:1fr}.tabs{overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<div id="login">
  <div class="lc">
    <div class="ll"><i class="ti ti-shield-check"></i></div>
    <div class="lo">المركز الوطني لمكافحة الأمراض</div>
    <div class="ld">إدارة التطعيمات — منصة البريد الرسمي</div>
    <div class="le" id="le"><i class="ti ti-alert-circle"></i> كلمة المرور غير صحيحة</div>
    <div class="rt">
      <div class="rb on" id="re" onclick="pickR('emp')"><i class="ti ti-user-circle"></i><span>موظف</span></div>
      <div class="rb" id="rm" onclick="pickR('mgr')"><i class="ti ti-crown"></i><span>مدير</span></div>
    </div>
    <div id="pf" style="display:none">
      <input type="password" id="lp" class="li" placeholder="كلمة مرور المدير" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="lb" onclick="doLogin()"><i class="ti ti-login"></i> دخول</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tb-brand">
      <div class="tb-ico"><i class="ti ti-shield-check"></i></div>
      <div><div class="tb-nm">إدارة التطعيمات</div><div class="tb-sb">NCDC — Libya</div></div>
    </div>
    <div class="tb-act">
      <div class="tb-srch"><i class="ti ti-search"></i><input type="text" placeholder="بحث..." oninput="Q=this.value;render()" id="si"></div>
      <div class="ib emp-only" onclick="openAdd()" title="إضافة"><i class="ti ti-plus"></i></div>
      <div class="ib mgr-only" onclick="expCSV()" title="تصدير"><i class="ti ti-download"></i></div>
      <div class="ib mgr-only" onclick="printA()" title="طباعة"><i class="ti ti-printer"></i></div>
      <div class="uc" onclick="doLogout()">
        <div class="ua" id="ua">م</div><span class="un" id="un">موظف</span>
        <i class="ti ti-logout" style="font-size:12px;color:var(--tx3)"></i>
      </div>
    </div>
  </div>
  <div class="tabs">
    <div class="nt on" id="nt-dash" onclick="go('dash')"><i class="ti ti-layout-dashboard"></i> لوحة التحكم</div>
    <div class="nt" id="nt-inbox" onclick="go('inbox')"><i class="ti ti-inbox"></i> الوارد <span class="nb" id="inb" style="display:none">0</span></div>
    <div class="nt" id="nt-outbox" onclick="go('outbox')"><i class="ti ti-send"></i> الصادر</div>
    <div class="nt" id="nt-archive" onclick="go('archive')"><i class="ti ti-archive"></i> الأرشيف</div>
    <div class="nt mgr-only" id="nt-rep" onclick="go('rep')"><i class="ti ti-chart-bar"></i> التقارير</div>
  </div>
  <div class="ct" id="ct"></div>
</div>

<div id="modals"></div>
<div class="tw" id="tw"></div>

<script>
const MGR='1821992',DB='ncdc_v8';
let db=null,storage=null,role=null,view='dash',Q='',mails=[],unsub=null,lR='emp';
let pR=null,pN=null,iD=null,iN=null;

// ── FIREBASE ──
try{
  firebase.initializeApp({
    apiKey: "AIzaSyCFbEW9iJKMZVtKTb9FsBjp4FduXtFUCJY",
    authDomain: "ncdc-mali.firebaseapp.com",
    databaseURL: "https://ncdc-mali-default-rtdb.firebaseio.com",
    projectId: "ncdc-mali",
    storageBucket: "ncdc-mali.firebasestorage.app",
    messagingSenderId: "465272815753",
    appId: "1:465272815753:web:4dbd1161ddf27dd9d60658",
    measurementId: "G-KKDW2HLY3Y"
  });
  db=firebase.firestore();
  storage=firebase.storage();
}catch(e){console.warn('Firebase:',e);}

// ── AUTH ──
function pickR(r){
  lR=r;
  document.getElementById('re').classList.toggle('on',r==='emp');
  document.getElementById('rm').classList.toggle('on',r==='mgr');
  document.getElementById('pf').style.display=r==='mgr'?'block':'none';
  document.getElementById('le').style.display='none';
}
function doLogin(){
  if(lR==='mgr'&&document.getElementById('lp').value!==MGR){
    document.getElementById('le').style.display='flex';
    document.getElementById('lp').value='';return;
  }
  role=lR;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  applyRole();initData();
  if(role==='mgr')requestNotifPerm();
}
function doLogout(){
  role=null;if(unsub)unsub();
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('lp').value='';pickR('emp');
}
function applyRole(){
  const m=role==='mgr';
  document.querySelectorAll('.mgr-only').forEach(e=>e.style.display=m?'':'none');

// ── NOTIFICATIONS ──
async function requestNotifPerm(){
  if(!('Notification' in window))return;
  await Notification.requestPermission();
}
function sendNotif(title,body){
  if(Notification.permission==='granted'){
    try{
      const n=new Notification(title,{body,icon:'/icons/icon-192.png',dir:'rtl',lang:'ar',tag:'ncdc-mail'});
      setTimeout(()=>n.close(),6000);
      n.onclick=()=>{window.focus();n.close();};
    }catch(e){}
  }
}

// ── DATA ──
function loadLocal(){
  try{const r=localStorage.getItem(DB);const p=r?JSON.parse(r):[];mails=p.length>0?p:seed();}
  catch{mails=seed();}
}
function saveLocal(){try{localStorage.setItem(DB,JSON.stringify(mails));}catch{}}
function initData(){
  if(!db){loadLocal();render();return;}
  unsub=db.collection('mails').orderBy('createdAt','desc').onSnapshot(async snap=>{
    if(snap.empty){
      const def=seed();
      const batch=db.batch();
      def.forEach(m=>{const{id,...d}=m;d.createdAt=firebase.firestore.FieldValue.serverTimestamp();batch.set(db.collection('mails').doc(id),d);});
      try{await batch.commit();}catch(e){}
      mails=def;saveLocal();render();return;
    }
    const prev=mails.map(m=>m.id);
    const loc=JSON.parse(localStorage.getItem(DB)||'[]');
    mails=snap.docs.map(d=>{
      const fd={id:d.id,...d.data()};
      const l=loc.find(x=>x.id===d.id);
      // المرفقات تُقرأ من Firebase أولاً، ومع ذلك نبقي نسخة محلية احتياطية للرسائل القديمة
      return l?{...fd,att:fd.att||l.att||null,attName:fd.attName||l.attName||null,img:fd.img||l.img||null,imgName:fd.imgName||l.imgName||null}:fd;
    });
    // إشعار عند وصول بريد جديد
    const newIds=mails.map(m=>m.id).filter(id=>!prev.includes(id));
    if(newIds.length&&prev.length&&role==='mgr'){
      const nm=mails.find(m=>m.id===newIds[0]);
      if(nm&&nm.type==='in')sendNotif('بريد وارد جديد — NCDC',nm.subject+' | '+nm.party);
    }
    render();
  },e=>{loadLocal();render();toast('يعمل محلياً',true);});
}
async function saveMail(m,isNew=false){
  const idx=mails.findIndex(x=>x.id===m.id);
  if(idx>=0)mails[idx]=m;else mails.unshift(m);
  saveLocal();
  if(db){
    try{
      const fd={...m};
      // نحفظ روابط/بيانات المرفقات حتى تظهر للمدير من أي جهاز، وليس محلياً فقط
      if(m.id&&!m.id.startsWith('L')){await db.collection('mails').doc(m.id).set(fd,{merge:true});}
      else{fd.createdAt=firebase.firestore.FieldValue.serverTimestamp();delete fd.id;const ref=await db.collection('mails').add(fd);mails[mails.findIndex(x=>x.id===m.id)].id=ref.id;saveLocal();}
    }catch(e){toast('خطأ Firebase',true);}
  }
  render();
  if(isNew&&m.type==='in')sendNotif('بريد وارد جديد',m.subject);
}
async function delMail(id){
  mails=mails.filter(x=>x.id!==id);saveLocal();
  if(db)try{await db.collection('mails').doc(id).delete();}catch{}
  render();
}

function S(icon,lbl,val,bg,cl){
  return`<div class="sc"><div class="sc-i" style="background:${bg};color:${cl}"><i class="ti ${icon}"></i></div><div class="sc-n">${val}</div><div class="sc-l">${lbl}</div></div>`;
}
function mkDonut(data,total){
  const r=42,cx=60,cy=60,sw=11,circ=2*Math.PI*r;let off=0;
  const segs=data.map(d=>{const p=total>0?d.v/total:0,da=circ*p,ga=circ-da;
    const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${sw}" stroke-dasharray="${da.toFixed(2)} ${ga.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=da;return s;}).join('');
  return`<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#283447" stroke-width="${sw}"/>${segs}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="17" font-weight="700" fill="#F1F5F9" font-family="Tajawal">${total}</text><text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="9" fill="#475569" font-family="Tajawal">إجمالي</text></svg>`;
}

// ── UPLOAD ATTACHMENTS ──
function safeFileName(name){
  const n=(name||'file').replace(/[^\u0600-\u06FFa-zA-Z0-9._-]/g,'_');
  return Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+n;
}
function timeoutPromise(p,ms,label){
  return Promise.race([
    p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error(label||'timeout')),ms))
  ]);
}
function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=e=>resolve(e.target.result);
    r.onerror=()=>reject(new Error('read-error'));
    r.readAsDataURL(file);
  });
}
async function compressImageFile(file){
  const dataUrl=await readAsDataURL(file);
  if(!file.type.startsWith('image/'))return dataUrl;
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400;
      let w=img.width,h=img.height;
      if(w>max||h>max){
        const ratio=Math.min(max/w,max/h);w=Math.round(w*ratio);h=Math.round(h*ratio);
      }
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}
async function uploadDataUrl(dataUrl,name,folder){
  if(!dataUrl)return null;
  // نحاول Firebase Storage، لكن لا نترك العملية معلّقة؛ بعد 8 ثواني نرجع للحفظ داخل Firestore.
  if(storage){
    try{
      const ref=storage.ref().child(`${folder}/${safeFileName(name)}`);
      await timeoutPromise(ref.putString(dataUrl,'data_url'),8000,'storage-timeout');
      return await timeoutPromise(ref.getDownloadURL(),5000,'url-timeout');
    }catch(e){console.warn('Storage upload failed/timeout, fallback to Firestore/base64',e);}
  }
  // احتياط مضمون للصور المضغوطة والملفات الصغيرة: حفظ Base64 داخل Firestore.
  if(dataUrl.length>850000){
    throw new Error('attachment-too-large');
  }
  return dataUrl;
}

async function saveNew(){

  const btn=document.getElementById('saveBtn');

  const party=type==='in'?document.getElementById('ffr').value.trim():document.getElementById('fto').value.trim();
  let attUrl=null,imgUrl=null;
  try{
    if(pR||iD)toast('جاري إرفاق الملف...');
    attUrl=pR?await uploadDataUrl(pR,pN||'attachment','mail-attachments'):null;
    imgUrl=iD?await uploadDataUrl(iD,iN||'image','mail-images'):null;
  }catch(e){
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.innerHTML='<i class="ti ti-check"></i> حفظ البريد';}

    return;
  }
  const mail={id:'L'+Date.now(),type,ref:document.getElementById('fr2').value.trim()||'غير محدد',
    date:document.getElementById('fd').value,party,subject:sub,
    status:document.getElementById('fst').value,priority:document.getElementById('fp2').value,
    notes:document.getElementById('fn').value.trim(),archived:false,
    att:attUrl,attName:pN||null,img:imgUrl,imgName:iN||null,
    createdAt:new Date().toISOString()};
  try{
    await saveMail(mail,true);
    closeModal();

  }
}

function expCSV(){

function toast(msg,err=false){
  const w=document.getElementById('tw');
  const d=document.createElement('div');
  d.className=`tt2 ${err?'terr':'tok'}`;
  d.innerHTML=`<i class="ti ti-${err?'alert-circle':'check'}"></i>${msg}`;
  w.appendChild(d);setTimeout(()=>d.remove(),3000);
}
